
{% extends "base.html" %}

{% block title %}Criar conta | ListaFácil{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Criar sua conta</h1>
    <p>Cadastre-se para organizar sua lista de compras.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Criar conta</button>
    </form>

    <p>
        Já possui uma conta?
        <a href="{% url 'login' %}">Entrar</a>
    </p>
</section>
{% endblock %}
