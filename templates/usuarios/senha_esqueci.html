
{% extends "base.html" %}

{% block title %}
    Recuperar senha | ListaFácil
{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Esqueci minha senha</h1>

    <p>
        Informe o e-mail utilizado no seu cadastro.
        Enviaremos as instruções para redefinir sua senha.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Enviar link de recuperação
        </button>
    </form>

    <p>
        <a href="{% url 'login' %}">
            Voltar para o login
        </a>
    </p>
</section>
{% endblock %}
